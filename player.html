<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LINUX CONTENT - Video Player</title>
    <style>
        :root {
            --primary: #0f172a;
            --sidebar-bg: #1e293b;
            --main-bg: #090d16;
            --card-bg: #1e293b;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --yellow: #eab308;
            --text: #f8fafc;
            --text-dim: #94a3b8;
            --border: #334155;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--primary);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden;
        }
        /* Top Banner */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--sidebar-bg);
            padding: 12px 24px;
            border-radius: 12px;
            margin-bottom: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 1px solid var(--border);
            flex-shrink: 0;
        }
        .logo {
            height: 45px;
            width: auto;
            object-fit: contain;
        }
        .header-center {
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 1.3rem;
            letter-spacing: -0.3px;
        }
        p.subtitle {
            color: var(--text-dim);
            font-size: 0.75rem;
            margin: 2px 0 0 0;
        }

        /* Workspace Layout */
        .workspace {
            display: flex;
            gap: 20px;
            flex-grow: 1;
            overflow: hidden;
        }

        /* Sidebar Panel */
        sidebar {
            width: 340px;
            background: var(--sidebar-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            flex-shrink: 0;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .section-group label, .playlist-group label, .fallback-group label, .control-group label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-dim);
            font-weight: 700;
            margin-bottom: 6px;
            display: block;
        }

        .section-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .sec-btn {
            background: #0f172a;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
        }
        .sec-btn:hover, .sec-btn.active {
            background: var(--accent);
            border-color: var(--accent);
        }

        /* Clickable Playlist Box */
        .playlist-container {
            background: #0f172a;
            border: 1px solid var(--border);
            border-radius: 8px;
            max-height: 150px;
            overflow-y: auto;
            padding: 6px;
        }
        .playlist-item {
            padding: 9px 12px;
            font-size: 0.85rem;
            color: var(--text-dim);
            background: #1e293b;
            margin-bottom: 4px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            border: 1px solid transparent;
            font-weight: 500;
        }
        .playlist-item:hover {
            color: var(--text);
            background: #334155;
        }
        .playlist-item.active {
            color: white;
            background: var(--accent);
            border-color: #60a5fa;
            font-weight: 600;
        }
        .playlist-placeholder {
            padding: 12px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--text-dim);
        }

        /* Fallback Picker Box */
        .fallback-box {
            background: #0f172a;
            border: 1px dashed var(--border);
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }
        input[type="file"] {
            display: none;
        }
        .custom-file-upload {
            background: #334155;
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
            transition: background 0.2s;
        }
        .custom-file-upload:hover {
            background: var(--accent);
        }

        /* Clock Module */
        .clock-card {
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .clock-card .time {
            font-size: 1rem;
            font-weight: 700;
            color: #38bdf8;
        }
        .clock-card .date {
            font-size: 0.7rem;
            color: var(--text-dim);
        }

        /* Yellow Visualizer Module */
        .visualizer-card {
            background: #0f172a;
            border-radius: 8px;
            border: 1px solid var(--border);
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex-grow: 1;
            min-height: 80px;
        }
        .visualizer-card span {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--yellow);
            font-weight: 700;
        }
        canvas {
            width: 100%;
            height: 100%;
            background: #05080f;
            border-radius: 6px;
            display: block;
        }

        /* Main Video Stage */
        main {
            flex-grow: 1;
            background: var(--sidebar-bg);
            border-radius: 12px;
            border: 1px solid var(--border);
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            box-sizing: border-box;
            gap: 14px;
        }
        
        /* Now Playing Banner */
        .now-playing-banner {
            width: 100%;
            max-width: 950px;
            background: #0f172a;
            border: 1px solid var(--border);
            padding: 10px 16px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-shrink: 0;
            box-sizing: border-box;
        }
        .np-badge {
            background: var(--yellow);
            color: #000;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 2px 8px;
            border-radius: 4px;
            text-transform: uppercase;
        }
        #currentVideoTitle {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Video Wrapper Container with Framed Border */
        .video-wrapper {
            width: 100%;
            max-width: 950px;
            display: flex;
            flex-direction: column;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            flex-grow: 1;
            max-height: calc(100% - 60px);
            position: relative;
        }

        video {
            width: 100%;
            flex-grow: 1;
            background: #000;
            outline: none;
            object-fit: contain;
            cursor: pointer;
        }

        /* Custom Permanent Control Bar */
        .custom-controls {
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(8px);
            border-top: 1px solid var(--border);
            padding: 10px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            flex-shrink: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        /* Fullscreen Auto-Hide Mode Logic */
        .video-wrapper.fullscreen-mode {
            width: 100vw !important;
            height: 100vh !important;
            max-width: none !important;
            max-height: none !important;
            border-radius: 0 !important;
            border: none !important;
        }

        .video-wrapper.fullscreen-mode.autohide-controls .custom-controls {
            opacity: 0;
            pointer-events: none;
            transform: translateY(20px);
        }

        .progress-row {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .time-display {
            font-size: 0.75rem;
            color: var(--text-dim);
            font-weight: 600;
            min-width: 35px;
            text-align: center;
        }

        /* Styled Scrubber Input Range */
        input[type="range"].seekbar {
            flex-grow: 1;
            appearance: none;
            -webkit-appearance: none;
            background: var(--border);
            height: 6px;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        input[type="range"].seekbar::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 12px;
            background: var(--accent);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }
        input[type="range"].seekbar::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        .buttons-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .controls-left, .controls-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ctrl-btn {
            background: #1e293b;
            color: var(--text);
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ctrl-btn:hover {
            background: var(--accent);
            border-color: var(--accent);
        }

        .volume-slider {
            width: 80px;
            appearance: none;
            -webkit-appearance: none;
            background: var(--border);
            height: 5px;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }
        .volume-slider::-webkit-slider-thumb {
            appearance: none;
            width: 10px;
            height: 10px;
            background: var(--text);
            border-radius: 50%;
            cursor: pointer;
        }

        footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-top: 12px;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <header>
        <img src="Holder.png" alt="Holder Logo" class="logo">
        <div class="header-center">
            <h1>VIDEO PLAYER</h1>
            <p class="subtitle">Video Player, lightweight and easy</p>
        </div>
        <img src="Linux Content LOGO.png" alt="Linux Content Logo" class="logo">
    </header>

    <div class="workspace">
        <!-- Sidebar Control Panel -->
        <sidebar>
            <!-- Section Directory -->
            <div class="section-group">
                <label>Section Directory</label>
                <div class="section-buttons">
                    <button class="sec-btn active" onclick="switchSection('Holder1', this)">Holder</button>
                    <button class="sec-btn" onclick="switchSection('Holder2', this)">Holder</button>
                </div>
            </div>

            <!-- Auto-Scan Folder Loader -->
            <div class="control-group">
                <label id="folderLoadLabel">1. Load Folder (Luke)</label>
                <div class="fallback-box">
                    <label for="folderInput" class="custom-file-upload">Select Section Folder</label>
                    <input type="file" id="folderInput" webkitdirectory directory multiple>
                </div>
            </div>

            <!-- Clickable Playlist -->
            <div class="playlist-group">
                <label id="playlistLabel">Playlist (Luke)</label>
                <div id="playlistContainer" class="playlist-container">
                    <div class="playlist-placeholder">Click 'Select Section Folder' above to load videos</div>
                </div>
            </div>

            <!-- Fallback Single File Picker -->
            <div class="fallback-group">
                <label>Fallback Quick Add</label>
                <div class="fallback-box">
                    <label for="fallbackFile" class="custom-file-upload">Choose Single Video</label>
                    <input type="file" id="fallbackFile" accept="video/*">
                </div>
            </div>

            <!-- Realtime Clock Widget -->
            <div class="clock-card">
                <div class="time" id="clockTime">--:--:--</div>
                <div class="date" id="clockDate">Loading Date...</div>
            </div>

            <!-- Yellow Audio Spectrum Visualizer -->
            <div class="visualizer-card">
                <span>Audio Spectrum (Live)</span>
                <canvas id="visualizer"></canvas>
            </div>
        </sidebar>

        <!-- Main Video Stage -->
        <main>
            <div class="now-playing-banner">
                <span class="np-badge">Now Playing</span>
                <span id="currentVideoTitle">Select a folder or video to begin</span>
            </div>

            <div class="video-wrapper" id="videoWrapper">
                <video id="mediaPlayer" crossorigin="anonymous">
                    Your browser does not support the video tag.
                </video>

                <!-- Custom Permanent Control Bar -->
                <div class="custom-controls">
                    <div class="progress-row">
                        <span id="currentTime" class="time-display">0:00</span>
                        <input type="range" id="seekBar" class="seekbar" value="0" min="0" max="100" step="0.1">
                        <span id="durationTime" class="time-display">0:00</span>
                    </div>
                    <div class="buttons-row">
                        <div class="controls-left">
                            <button class="ctrl-btn" id="playPauseBtn">▶ Pause</button>
                            <button class="ctrl-btn" id="muteBtn">🔊</button>
                            <input type="range" id="volumeBar" class="volume-slider" min="0" max="1" step="0.05" value="1">
                        </div>
                        <div class="controls-right">
                            <button class="ctrl-btn" id="fullscreenBtn">⛶ Fullscreen (F)</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <footer>
        Made for Educational and Proffesional Purposes (Available in Github)
    </footer>

    <script>
        // Live Clock Script
        function updateClock() {
            const now = new Date();
            document.getElementById('clockTime').innerText = now.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('clockDate').innerText = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        let currentSection = 'Luke';
        const folderInput = document.getElementById('folderInput');
        const fallbackFile = document.getElementById('fallbackFile');
        const playlistContainer = document.getElementById('playlistContainer');
        const playlistLabel = document.getElementById('playlistLabel');
        const folderLoadLabel = document.getElementById('folderLoadLabel');
        const mediaPlayer = document.getElementById('mediaPlayer');
        const currentVideoTitle = document.getElementById('currentVideoTitle');
        const videoWrapper = document.getElementById('videoWrapper');

        // Custom Control Elements
        const playPauseBtn = document.getElementById('playPauseBtn');
        const seekBar = document.getElementById('seekBar');
        const currentTimeDisplay = document.getElementById('currentTime');
        const durationTimeDisplay = document.getElementById('durationTime');
        const muteBtn = document.getElementById('muteBtn');
        const volumeBar = document.getElementById('volumeBar');
        const fullscreenBtn = document.getElementById('fullscreenBtn');

        // Canvas & Visualizer References
        const canvas = document.getElementById('visualizer');
        const ctx = canvas.getContext('2d');

        let audioCtx, analyser, sourceNode;
        let isInitialized = false;

        function switchSection(sectionName, element) {
            document.querySelectorAll('.sec-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
            currentSection = sectionName;
            playlistLabel.innerText = `Playlist (${sectionName})`;
            folderLoadLabel.innerText = `1. Load Folder (${sectionName})`;
        }

        // Format Seconds into Minutes:Seconds
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Play/Pause Toggle
        function togglePlayPause() {
            if (mediaPlayer.paused) {
                mediaPlayer.play();
            } else {
                mediaPlayer.pause();
            }
        }

        playPauseBtn.addEventListener('click', togglePlayPause);
        mediaPlayer.addEventListener('click', togglePlayPause);

        mediaPlayer.addEventListener('play', () => {
            playPauseBtn.innerText = '⏸ Pause';
        });
        mediaPlayer.addEventListener('pause', () => {
            playPauseBtn.innerText = '▶ Play';
        });

        // Update Progress Bar and Time Readouts
        mediaPlayer.addEventListener('timeupdate', () => {
            if (!isNaN(mediaPlayer.duration)) {
                const percentage = (mediaPlayer.currentTime / mediaPlayer.duration) * 100;
                seekBar.value = percentage;
                currentTimeDisplay.innerText = formatTime(mediaPlayer.currentTime);
            }
        });

        mediaPlayer.addEventListener('loadedmetadata', () => {
            durationTimeDisplay.innerText = formatTime(mediaPlayer.duration);
        });

        // Scrubber Seeking
        seekBar.addEventListener('input', () => {
            if (!isNaN(mediaPlayer.duration)) {
                const time = (seekBar.value / 100) * mediaPlayer.duration;
                mediaPlayer.currentTime = time;
            }
        });

        // Volume Controls
        volumeBar.addEventListener('input', () => {
            mediaPlayer.volume = volumeBar.value;
            mediaPlayer.muted = false;
            muteBtn.innerText = volumeBar.value == 0 ? '🔇' : '🔊';
        });

        muteBtn.addEventListener('click', () => {
            mediaPlayer.muted = !mediaPlayer.muted;
            if (mediaPlayer.muted) {
                muteBtn.innerText = '🔇';
                volumeBar.value = 0;
            } else {
                muteBtn.innerText = '🔊';
                volumeBar.value = mediaPlayer.volume;
            }
        });

        // Fullscreen Toggle function with Threshold Auto-Hide
        let hideTimeout;
        const idleDelay = 2500; // Time before hiding controls (ms)
        const moveThreshold = 15; // Minimum cumulative pixels moved to wake controls up
        let lastMouseX = 0;
        let lastMouseY = 0;
        let accumulatedMovement = 0;

        function toggleFullscreen() {
            if (!document.fullscreenElement) {
                videoWrapper.requestFullscreen().catch(err => {
                    alert(`Error attempting to enable fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen();
            }
        }

        fullscreenBtn.addEventListener('click', toggleFullscreen);

        // Track Fullscreen state changes
        document.addEventListener('fullscreenchange', () => {
            if (document.fullscreenElement) {
                videoWrapper.classList.add('fullscreen-mode', 'autohide-controls');
                resetHideTimer();
            } else {
                videoWrapper.classList.remove('fullscreen-mode', 'autohide-controls');
                clearTimeout(hideTimeout);
                accumulatedMovement = 0;
            }
        });

        // Advanced Mouse Movement Handler with Distance Threshold
        videoWrapper.addEventListener('mousemove', (e) => {
            if (!document.fullscreenElement) return;

            const deltaX = Math.abs(e.clientX - lastMouseX);
            const deltaY = Math.abs(e.clientY - lastMouseY);
            accumulatedMovement += (deltaX + deltaY);

            lastMouseX = e.clientX;
            lastMouseY = e.clientY;

            if (accumulatedMovement > moveThreshold) {
                videoWrapper.classList.remove('autohide-controls');
                resetHideTimer();
            }
        });

        function resetHideTimer() {
            clearTimeout(hideTimeout);
            accumulatedMovement = 0;
            
            if (!mediaPlayer.paused) {
                hideTimeout = setTimeout(() => {
                    if (document.fullscreenElement) {
                        videoWrapper.classList.add('autohide-controls');
                    }
                }, idleDelay);
            }
        }

        mediaPlayer.addEventListener('pause', () => {
            clearTimeout(hideTimeout);
            videoWrapper.classList.remove('autohide-controls');
        });

        mediaPlayer.addEventListener('play', () => {
            if (document.fullscreenElement) {
                resetHideTimer();
            }
        });

        // Global Keyboard Shortcut: Press 'F' to Fullscreen (and spacebar to play/pause)
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT') return;

            if (e.key.toLowerCase() === 'f') {
                e.preventDefault();
                toggleFullscreen();
            } else if (e.key === ' ') {
                e.preventDefault();
                togglePlayPause();
            }
        });

        // Folder Auto-Scan Handler
        folderInput.addEventListener('change', function(event) {
            const files = Array.from(event.target.files);
            const videoFiles = files.filter(file => file.type.startsWith('video/') || file.name.match(/\.(mp4|m4v|webm|ogv|mov)$/i));

            playlistContainer.innerHTML = '';

            if (videoFiles.length === 0) {
                playlistContainer.innerHTML = '<div class="playlist-placeholder">No video files found in selected folder</div>';
                return;
            }

            videoFiles.forEach((file, index) => {
                const item = document.createElement('div');
                item.className = 'playlist-item';
                item.innerText = file.name;

                item.addEventListener('click', () => {
                    document.querySelectorAll('.playlist-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');

                    currentVideoTitle.innerText = file.name;
                    const fileURL = URL.createObjectURL(file);
                    mediaPlayer.src = fileURL;
                    mediaPlayer.load();
                    mediaPlayer.play();

                    if (!isInitialized) {
                        initVisualizer();
                    }
                });

                playlistContainer.appendChild(item);

                if (index === 0) {
                    item.click();
                }
            });
        });

        // Fallback Single File Handler
        fallbackFile.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const item = document.createElement('div');
                item.className = 'playlist-item active';
                item.innerText = file.name;
                
                playlistContainer.innerHTML = '';
                playlistContainer.appendChild(item);

                currentVideoTitle.innerText = file.name;
                const fileURL = URL.createObjectURL(file);
                mediaPlayer.src = fileURL;
                mediaPlayer.load();
                mediaPlayer.play();

                if (!isInitialized) {
                    initVisualizer();
                }
            }
        });

        // Audio Visualizer Script (Yellow Theme)
        function initVisualizer() {
            try {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                analyser = audioCtx.createAnalyser();
                sourceNode = audioCtx.createMediaElementSource(mediaPlayer);
                
                sourceNode.connect(analyser);
                analyser.connect(audioCtx.destination);
                analyser.fftSize = 32;

                isInitialized = true;
                drawVisualizer();
            } catch (e) {
                console.log("Audio visualizer initialization note: ", e);
            }
        }

        function drawVisualizer() {
            requestAnimationFrame(drawVisualizer);

            canvas.width = canvas.offsetWidth;
            canvas.height = canvas.offsetHeight;

            const bufferLength = analyser.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            analyser.getByteFrequencyData(dataArray);

            ctx.fillStyle = '#05080f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            const numBars = 12;
            const barWidth = (canvas.width / numBars) - 4;
            let x = 0;

            for (let i = 0; i < numBars; i++) {
                const dataIndex = Math.floor(i * (bufferLength / numBars));
                const barHeight = (dataArray[dataIndex] / 255) * canvas.height;

                const gradient = ctx.createLinearGradient(0, canvas.height, 0, 0);
                gradient.addColorStop(0, '#ca8a04');
                gradient.addColorStop(0.5, '#eab308');
                gradient.addColorStop(1, '#fef08a');

                ctx.fillStyle = gradient;
                ctx.fillRect(x, canvas.height - barHeight, barWidth, Math.max(barHeight, 4));

                x += barWidth + 4;
            }
        }
    </script>
</body>
</html>
